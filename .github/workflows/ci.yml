name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 检查格式
        run: ruff format --check app tests migrations

      - name: 静态检查
        run: ruff check app tests migrations

      - name: 检查依赖一致性
        run: python -m pip check

      - name: 验证数据库迁移脚本
        run: alembic upgrade head --sql > /dev/null

      - name: 运行测试
        run: pytest -q

      - name: 检查前端 JavaScript 语法
        working-directory: .
        run: node --check backend/app/static/app.js

      - name: 验证开发与生产 Compose
        working-directory: .
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.production.yaml config --quiet

      - name: 扫描密钥与超大文件
        working-directory: .
        shell: pwsh
        run: ./scripts/security-check.ps1
