name: computer-use-session-manager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-computeruse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-computeruse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-computeruse}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  sandbox-image:
    image: computer-use-sandbox:local
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-computeruse}:${POSTGRES_PASSWORD:-computeruse_dev}@postgres:5432/${POSTGRES_DB:-computeruse}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      RUNTIME_PROVIDER: docker
      SANDBOX_IMAGE: computer-use-sandbox:local
      SANDBOX_PUBLIC_HOST: ${SANDBOX_PUBLIC_HOST:-127.0.0.1}
      SANDBOX_MEMORY_LIMIT: ${SANDBOX_MEMORY_LIMIT:-768m}
      SANDBOX_NANO_CPUS: ${SANDBOX_NANO_CPUS:-1000000000}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-256}
      SANDBOX_SHM_SIZE: ${SANDBOX_SHM_SIZE:-256m}
      VNC_ACCESS_TTL_SECONDS: ${VNC_ACCESS_TTL_SECONDS:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
